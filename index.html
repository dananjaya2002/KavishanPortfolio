<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Danidu Kavishan is a software developer building applied AI, mobile, and web products with Python, React, and Flutter."
    />
    <meta name="theme-color" content="#060C18" />
    <script>
      try { document.documentElement.dataset.theme = localStorage.getItem("theme") === "light" ? "light" : "dark"; }
      catch { document.documentElement.dataset.theme = "dark"; }
      try {
        const mode = localStorage.getItem("engineering-mode");
        document.documentElement.dataset.engineeringMode = ["full-stack", "platform", "ai"].includes(mode) ? mode : "full-stack";
      } catch { document.documentElement.dataset.engineeringMode = "full-stack"; }
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Danidu Kavishan | Software Developer" />
    <meta property="og:description" content="Applied AI, mobile, and web projects built with a focus on useful, dependable software." />
    <meta property="og:url" content="https://danidukavishan.site/" />
    <meta name="twitter:card" content="summary" />
    <link rel="canonical" href="https://danidukavishan.site/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Danidu Kavishan | Software Developer</title>
  </head>

  </body>
